name: QA

on:
    push:
    pull_request:

jobs:
    qa:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v3

            - name: Install just
              uses: extractions/setup-just@v2

            - name: Set up Python
              run: uv python install 3.14

            - name: Install dependencies
              run: uv sync

            - name: Run QA checks
              run: just qa
