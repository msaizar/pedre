[project]
site_name = "Pedre Documentation"
site_description = "A Python RPG framework built on Arcade with seamless Tiled map editor integration"
site_author = "Martin Saizar"
repo_url = "https://github.com/msaizar/pedre"

nav = [
    {"Home" = "index.md"},
    {"Getting Started" = "getting-started.md"},
    {"Guides" = [
        "guides/tiled-integration.md",
        "guides/configuration.md",
        "guides/cli.md",
    ]},
    {"API Reference" = [
        "api/index.md",
        "api/game.md",
        "api/views.md",
        "api/sprites.md",
        "api/game-context.md",
        "api/event-bus.md",
        "api/plugin-loader.md",
        "api/validators.md",
    ]},
    {"Plugins" = [
        "plugins/index.md",
        "plugins/audio.md",
        "plugins/cache.md",
        "plugins/camera.md",
        "plugins/debug.md",
        "plugins/dialog.md",
        "plugins/input.md",
        "plugins/interaction.md",
        "plugins/inventory.md",
        "plugins/npc.md",
        "plugins/particle.md",
        "plugins/pathfinding.md",
        "plugins/pause-menu.md",
        "plugins/physics.md",
        "plugins/player.md",
        "plugins/portal.md",
        "plugins/save.md",
        "plugins/scene.md",
        "plugins/script.md",
        "plugins/waypoint.md",
    ]},
    {"Content Registries" = [
        "content/index.md",
        "content/dialogs.md",
        "content/items.md",
        "content/maps.md",
        "content/npcs.md",
        "content/players.md",
        "content/sprites.md",
    ]},
    {"Scripting" = [
        "scripting/index.md",
        "scripting/basics.md",
        "scripting/events.md",
        "scripting/conditions.md",
        "scripting/actions.md",
        "scripting/advanced.md",
        "scripting/examples.md",
    ]},
    {"Extending Pedre" = [
        "extending/index.md",
        "extending/custom-actions.md",
        "extending/custom-events.md",
        "extending/custom-conditions.md",
        "extending/custom-plugins.md",
        "extending/custom-commands.md",
        "extending/custom-content.md",
    ]},
]

[project.extra]
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/msaizar/pedre" },
    { icon = "fontawesome/brands/python", link = "https://pypi.org/project/pedre/" },
]

[theme]
name = "material"
palette = [
    { scheme = "default", primary = "indigo", accent = "indigo", toggle = { icon = "material/brightness-7", name = "Switch to dark mode" } },
    { scheme = "slate", primary = "indigo", accent = "indigo", toggle = { icon = "material/brightness-4", name = "Switch to light mode" } },
]
features = [
    "navigation.instant",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
]

[markdown_extensions]
pymdownx.highlight = { use_pygments = true }
pymdownx.superfences = { custom_fences = [
    { name = "mermaid", class = "mermaid", format = "!!python/name:pymdownx.superfences.fence_code_format" }
] }
pymdownx.inlinehilite = true
pymdownx.snippets = true
pymdownx.tabbed = { alternate_style = true }
admonition = true
codehilite = true
toc = { permalink = true }
